<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 600; fill: #1a1a1a; }
    .subtitle { font-size: 12px; fill: #6a6a6a; }
    .label { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .sublabel { font-size: 11px; fill: #6a6a6a; }
    .value { font-size: 13px; font-weight: 600; }
    .axis { font-size: 10px; fill: #9a9a9a; }
  </style>

  <rect x="0" y="0" width="820" height="300" fill="#ffffff" rx="8" />

  <text x="24" y="30" class="title">TriagePilot Crash-Triage Eval — Cross-Platform Results</text>
  <text x="24" y="48" class="subtitle">Reproduction rate per backend (bar) · accuracy is scored only on examples that actually reproduced</text>

  <!-- Plot area: x from 190 to 550, representing 0%-100% -->
  <g stroke="#eaeaea" stroke-width="1">
    <line x1="190" y1="80"  x2="190" y2="250" />
    <line x1="280" y1="80"  x2="280" y2="250" />
    <line x1="370" y1="80"  x2="370" y2="250" />
    <line x1="460" y1="80"  x2="460" y2="250" />
    <line x1="550" y1="80"  x2="550" y2="250" />
  </g>
  <g class="axis" text-anchor="middle">
    <text x="190" y="266">0%</text>
    <text x="280" y="266">25%</text>
    <text x="370" y="266">50%</text>
    <text x="460" y="266">75%</text>
    <text x="550" y="266">100%</text>
  </g>

  <!-- Row 1: GDB / Linux -->
  <text x="24" y="98" class="label">GDB</text>
  <text x="24" y="112" class="sublabel">Linux (ubuntu-latest)</text>
  <rect x="190" y="90" width="360" height="22" fill="#f2f2f2" rx="4" />
  <rect x="190" y="90" width="360" height="22" fill="#2da44e" rx="4" />
  <text x="566" y="106" class="value" fill="#2da44e">17/17 reproduced</text>
  <text x="566" y="122" class="sublabel">100% accuracy</text>

  <!-- Row 2: LLDB / macOS -->
  <text x="24" y="160" class="label">LLDB</text>
  <text x="24" y="174" class="sublabel">macOS (macos-latest)</text>
  <rect x="190" y="152" width="360" height="22" fill="#f2f2f2" rx="4" />
  <rect x="190" y="152" width="360" height="22" fill="#2da44e" rx="4" />
  <text x="566" y="168" class="value" fill="#2da44e">16/16 reproduced</text>
  <text x="566" y="184" class="sublabel">100% accuracy</text>

  <!-- Row 3: CDB / Windows -->
  <text x="24" y="222" class="label">CDB</text>
  <text x="24" y="236" class="sublabel">Windows (windows-latest)</text>
  <rect x="190" y="214" width="360" height="22" fill="#f2f2f2" rx="4" />
  <rect x="190" y="214" width="202" height="22" fill="#cf222e" rx="4" />
  <text x="566" y="230" class="value" fill="#cf222e">9/16 reproduced</text>
  <text x="566" y="246" class="sublabel">70% accuracy</text>

  <text x="24" y="288" class="sublabel">Non-reproductions are example/allocator-specific (documented in eval/README.md), not TriagePilot defects.</text>
</svg>

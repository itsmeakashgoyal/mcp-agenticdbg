name: DCO

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dco:
    name: DCO Sign-Off Check
    runs-on: ubuntu-latest
    steps:
      # Plain `pull_request` (not `pull_request_target`) checks out the PR's
      # own commits safely for both same-repo branches and forks, using the
      # workflow file from the base branch -- no need to special-case forks
      # or manually add an upstream remote. This also fixes a bug in the
      # previous version, which only ran this check for fork PRs and silently
      # skipped it for the maintainer's own branches.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FAILED=0
          for SHA in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            if ! git log -1 --format='%B' "$SHA" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $SHA is missing 'Signed-off-by' trailer"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "All commits must include a DCO sign-off."
            echo "Use: git commit -s -m \"your message\""
            echo "To fix existing commits: git rebase --signoff HEAD~N && git push --force-with-lease"
            exit 1
          fi
          echo "All commits have DCO sign-off."

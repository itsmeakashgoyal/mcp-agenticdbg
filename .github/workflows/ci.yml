name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      #
      # cache-suffix: every job/matrix-leg below needs a *distinct* value --
      # setup-uv's own cache key already varies by OS/arch, but not by job,
      # so without this every job on the same OS races to save an identical
      # cache key and most lose with a benign but noisy "Unable to reserve
      # cache ... another job may be creating this cache" warning. See
      # https://github.com/astral-sh/setup-uv#cache for the cache-suffix option.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: lint
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: type-check
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra langgraph
      - run: uv run mypy src/triagepilot/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # windows-11-arm is GitHub's hosted Windows/ARM64 runner (GA, free
        # on public repos) -- added as a single extra leg (not crossed with
        # the python-version list above) to cover the win32+ARM64 marker in
        # pyproject.toml's mcp pin (cryptography ships no win_arm64 wheel,
        # so mcp must stay <1.20 there; see that file's comment). Pinned to
        # 3.13 because that's the only Python actions/setup-python can get
        # on this runner today -- it ships preinstalled on the image, and
        # setup-python can't download win_arm64 builds for other versions
        # (native ARM64 Python support there is still an open gap:
        # https://github.com/actions/partner-runner-images/issues/85).
        include:
          - os: windows-11-arm
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # setup-uv's own cache key already varies by OS/arch; the
          # python-version needs to be added explicitly since three matrix
          # legs otherwise share an OS and would race for the same key.
          cache-suffix: test-${{ matrix.python-version }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev --extra langgraph
      - run: uv run pytest -x --tb=short

  verify-install-pip:
    name: Verify pip Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm: see the `test` job above for why ARM64 is covered.
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # 3.13, not 3.12: it's the only version actions/setup-python can
          # get on windows-11-arm (preinstalled on the image; setup-python
          # can't download win_arm64 builds for other versions yet).
          python-version: "3.13"
      # shell: bash works on windows-latest too (Git Bash ships on GitHub's
      # Windows runners), so every step below tees its combined
      # stdout/stderr into ci-logs/ with one consistent syntax across all
      # three OSes. `set -euo pipefail` keeps `tee` from swallowing the
      # underlying command's exit code, so a failure still fails the step.
      - name: Install (pip, no extras -- matches README quick start)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          python -m pip install --upgrade pip 2>&1 | tee ci-logs/01-pip-upgrade.log
          pip install -e . 2>&1 | tee ci-logs/02-pip-install.log
      - name: Capture environment info
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          { python --version; pip --version; pip freeze; } > ci-logs/00-environment.log 2>&1 || true
      - name: CLI entry point smoke test
        shell: bash
        run: |
          set -euo pipefail
          triagepilot --help 2>&1 | tee ci-logs/03-cli-help.log
      - name: Module invocation smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m triagepilot --help 2>&1 | tee ci-logs/04-module-invocation.log
      - name: MCP protocol handshake smoke test
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_mcp_server.py 2>&1 | tee ci-logs/05-mcp-handshake.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-install-pip-logs-${{ matrix.os }}
          path: ci-logs/

  verify-install-uv:
    name: Verify uv Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm: see the `test` job above for why ARM64 is covered.
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: verify-install-uv
      - uses: actions/setup-python@v6
        with:
          # 3.13: see verify-install-pip above for why this differs from
          # the 3.12 used elsewhere in this file.
          python-version: "3.13"
      - name: Install (uv, no dev/extras -- matches README quick start)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          uv sync 2>&1 | tee ci-logs/01-uv-sync.log
      - name: Capture environment info
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          { uv run python --version; uv pip list; } > ci-logs/00-environment.log 2>&1 || true
      - name: CLI entry point smoke test
        shell: bash
        run: |
          set -euo pipefail
          uv run triagepilot --help 2>&1 | tee ci-logs/02-cli-help.log
      - name: Module invocation smoke test
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m triagepilot --help 2>&1 | tee ci-logs/03-module-invocation.log
      - name: MCP protocol handshake smoke test
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/verify_mcp_server.py --command "uv run triagepilot" 2>&1 | tee ci-logs/04-mcp-handshake.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-install-uv-logs-${{ matrix.os }}
          path: ci-logs/

  eval:
    name: Crash-Triage Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: eval
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Allow core dumps (disable apport redirection)
        run: |
          echo core | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c unlimited
      - run: uv sync --dev
      - name: Run eval harness
        run: uv run python eval/run_eval.py
      - name: Publish results to job summary
        if: always()
        run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval/results.md

  macos-eval:
    name: Crash-Triage Eval (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: macos-eval
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Run eval harness
        # Runs each example under lldb (process save-core) instead of a
        # plain core dump, since ReportCrash intercepts the signal first --
        # see eval/README.md's "macOS and Windows crash capture" section.
        run: uv run python eval/run_eval.py
      - name: Publish results to job summary
        if: always()
        run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-macos
          path: eval/results.md

  windows-eval:
    name: Crash-Triage Eval (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: windows-eval
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # step-security/msvc-dev-cmd is a maintained, node24-based drop-in
      # replacement for ilammy/msvc-dev-cmd (same inputs: arch, sdk,
      # spectre, toolset, uwp, vsversion) -- ilammy's own action.yml still
      # declares "using: node20" as of this writing (upstream looks
      # unmaintained; last tagged release is from Jan 2024), which GitHub
      # now flags as deprecated on every run even though it's transparently
      # re-executed on Node 24 today.
      - uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
      - name: Install WinDbg from Microsoft Store
        run: winget install 9PGJGD53TN86 --accept-source-agreements --accept-package-agreements
      - run: uv sync --dev
      - name: Run eval harness
        # Builds each example with cl.exe (see run_eval.py's
        # _build_binary_windows) and detects crashes via the .dmp file
        # crashdump.h's SetUnhandledExceptionFilter writes, not a POSIX
        # core file -- see eval/README.md's "macOS and Windows crash
        # capture" section, including the known abort()-based-example
        # caveat that hasn't been verified against a real Windows run yet.
        run: uv run python eval/run_eval.py
      - name: Publish results to job summary
        if: always()
        run: |
          Get-Content eval/results.md -ErrorAction SilentlyContinue |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-windows
          path: eval/results.md

  linux-gdb-smoke-test:
    name: Linux GDB Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: linux-gdb-smoke-test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Allow core dumps (disable apport redirection)
        run: echo core | sudo tee /proc/sys/kernel/core_pattern
      - run: uv sync --dev
      - name: Build and crash a Linux example, generating a real core
        # ulimit must be set in the same shell invocation that runs the
        # crashing binary -- it doesn't carry over between separate `run:`
        # steps. The "core" pattern set above writes a single ./core file
        # (no %p) in the process's cwd, so running from a scratch dir gives
        # a fixed, predictable path. `set -o pipefail` so a failing command
        # piped into `tee` still fails the step -- ci-logs/ is uploaded on
        # failure so build/crash output is visible without a GitHub login.
        run: |
          set -euo pipefail
          mkdir -p /tmp/gdb-live-test ci-logs
          g++ -g -O0 -std=c++17 -Iexamples/common -o /tmp/gdb-live-test/use-after-free examples/common/use-after-free.cpp \
            2>&1 | tee ci-logs/01-build.log
          cd /tmp/gdb-live-test
          ulimit -c unlimited
          ./use-after-free 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/02-crash-run.log" || true
          if [ ! -f core ]; then
            echo "ERROR: no core file produced" >&2
            exit 1
          fi
          echo "TRIAGEPILOT_LIVE_GDB_DUMP=/tmp/gdb-live-test/core" >> "$GITHUB_ENV"
          echo "TRIAGEPILOT_LIVE_GDB_BINARY=/tmp/gdb-live-test/use-after-free" >> "$GITHUB_ENV"
      - name: Run live GDB integration tests
        # Exercises the CLI-fallback-mode marker-isolation and
        # timeout-recovery fixes, plus a sanity check on MI mode's
        # SIGINT-on-timeout addition, against a real gdb -- see
        # tests/test_gdb_live.py for what each test proves.
        run: |
          set -o pipefail
          uv run pytest tests/test_gdb_live.py -v --tb=short 2>&1 | tee ci-logs/03-pytest.log
      - name: Upload core + binary + logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-gdb-smoke-test-artifacts
          path: |
            /tmp/gdb-live-test/
            ci-logs/

  macos-lldb-smoke-test:
    name: macOS LLDB Smoke Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: macos-lldb-smoke-test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Build macOS crash examples
        # `set -o pipefail` so a build failure piped into `tee` still fails
        # the step -- ci-logs/ is uploaded on failure so this output is
        # visible without a GitHub login.
        run: |
          mkdir -p ci-logs
          cd examples/macos
          chmod +x build.sh
          set -o pipefail
          ./build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/01-build.log"
      - name: Generate a real core dump
        # gen_core_mac.sh runs the binary under lldb itself and saves a
        # core via `process save-core` at the moment of the crash, which
        # sidesteps macOS's ReportCrash interception and /cores permission
        # issues that plague plain `ulimit -c unlimited` (see the script's
        # own comments). Output paths are fixed, not PID-based.
        run: |
          cd examples/macos
          chmod +x gen_core_mac.sh
          set -o pipefail
          ./gen_core_mac.sh use-after-free 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/02-gen-core.log"
          echo "TRIAGEPILOT_LIVE_LLDB_DUMP=$(pwd)/build/out/core.use-after-free" >> "$GITHUB_ENV"
          echo "TRIAGEPILOT_LIVE_LLDB_BINARY=$(pwd)/build/out/use-after-free" >> "$GITHUB_ENV"
      - name: Run live LLDB integration tests
        # Exercises the marker-isolation, timeout-recovery, and shutdown
        # fixes against a real lldb -- see tests/test_lldb_live.py for
        # what each test proves.
        run: |
          set -o pipefail
          uv run pytest tests/test_lldb_live.py -v --tb=short 2>&1 | tee ci-logs/03-pytest.log
      - name: Upload core + binary + logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-lldb-smoke-test-artifacts
          path: |
            examples/macos/build/out/
            ci-logs/

  windows-cdb-smoke-test:
    name: Windows CDB Smoke Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      # setup-uv publishes immutable releases and no longer moves floating
      # major-version tags (e.g. @v8), so it must be pinned to an exact
      # commit SHA with the version as a comment, per its own README.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-suffix: windows-cdb-smoke-test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # step-security/msvc-dev-cmd is a maintained, node24-based drop-in
      # replacement for ilammy/msvc-dev-cmd (same inputs: arch, sdk,
      # spectre, toolset, uwp, vsversion) -- ilammy's own action.yml still
      # declares "using: node20" as of this writing (upstream looks
      # unmaintained; last tagged release is from Jan 2024), which GitHub
      # now flags as deprecated on every run even though it's transparently
      # re-executed on Node 24 today. Puts cl.exe/link.exe on PATH.
      - uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
      - name: Create log directory
        run: New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\ci-logs" -Force | Out-Null
      # Same package + approach upstream mcp-windbg's own CI uses to get a
      # real cdb.exe onto a GitHub-hosted Windows runner: a silent,
      # non-interactive install of the official WinDbg Store app, which
      # lands at %LOCALAPPDATA%\Microsoft\WindowsApps\cdbX64.exe (already
      # one of CDBSession.DEFAULT_CDB_PATHS).
      - name: Install WinDbg from Microsoft Store
        run: |
          winget install 9PGJGD53TN86 --accept-source-agreements --accept-package-agreements 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\ci-logs\01-winget-install.log"
      - name: uv sync
        run: uv sync --dev 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\ci-logs\02-uv-sync.log"
      - name: Build Windows crash examples
        run: |
          cd examples\windows
          .\build.ps1 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\ci-logs\03-build.log"
      - name: Generate a real crash dump
        run: |
          cd examples\windows
          .\run-all.ps1 -Name use-after-free 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\ci-logs\04-run-all.log"
      - name: Locate generated dump
        run: |
          $dump = Get-ChildItem -Path "examples\windows\build\out\dumps" -Filter "*.dmp" |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dump) {
            Write-Error "No .dmp file was generated by run-all.ps1"
            exit 1
          }
          Write-Host "Using dump: $($dump.FullName)"
          "TRIAGEPILOT_LIVE_CDB_DUMP=$($dump.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run live CDB integration tests
        # Exercises the marker-isolation, timeout-recovery, and
        # process-tree-cleanup fixes in backends/cdb.py against a real
        # cdb.exe -- see tests/test_cdb_live.py for what each test proves
        # and why a mocked unit test can't cover the same ground.
        run: |
          uv run pytest tests/test_cdb_live.py -v --tb=short 2>&1 |
            Tee-Object -FilePath "$env:GITHUB_WORKSPACE\ci-logs\05-pytest.log"
      - name: Upload dump + build output + logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-cdb-smoke-test-artifacts
          path: |
            examples\windows\build\out\dumps\*.dmp
            examples\windows\build\out\*.pdb
            ci-logs\

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra langgraph
      - run: uv run mypy src/triagepilot/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --dev --extra langgraph
      - run: uv run pytest -x --tb=short

  verify-install-pip:
    name: Verify pip Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pip, no extras -- matches README quick start)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: CLI entry point smoke test
        run: triagepilot --help
      - name: Module invocation smoke test
        run: python -m triagepilot --help
      - name: MCP protocol handshake smoke test
        run: python scripts/verify_mcp_server.py

  verify-install-uv:
    name: Verify uv Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (uv, no dev/extras -- matches README quick start)
        run: uv sync
      - name: CLI entry point smoke test
        run: uv run triagepilot --help
      - name: Module invocation smoke test
        run: uv run python -m triagepilot --help
      - name: MCP protocol handshake smoke test
        run: uv run python scripts/verify_mcp_server.py --command "uv run triagepilot"

  eval:
    name: Crash-Triage Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdb
        run: sudo apt-get update && sudo apt-get install -y gdb
      - name: Allow core dumps (disable apport redirection)
        run: |
          echo core | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c unlimited
      - run: uv sync --dev
      - name: Run eval harness
        run: uv run python eval/run_eval.py
      - name: Publish results to job summary
        if: always()
        run: cat eval/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.md

[project]
name = "triagepilot"
version = "1.0.0"
description = "MCP server supporting CDB (Windows), GDB (Linux), and LLDB (macOS)"
readme = "README.md"
requires-python = ">=3.10"  # 3.11+ recommended; 3.10 supported
dependencies = [
    # mcp 2.0.0 (2026-07-28) renamed McpError -> MCPError and made other
    # breaking protocol/API changes. Pin below 2 until the codebase is
    # deliberately migrated -- see src/triagepilot/server.py and
    # tools/{debugger_tools,git_tools}.py for McpError usage.
    #
    # mcp 1.20.0 added a hard pyjwt[crypto] -> cryptography dependency.
    # cryptography publishes no win_arm64 wheels (any version), so on
    # Windows/ARM64 this forces a source build requiring a local Rust +
    # OpenSSL toolchain. Stay on the last pre-cryptography release there;
    # every other platform gets the normal unconstrained range.
    "mcp>=1.17.0,<1.20; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "mcp>=1.17.0,<2; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.9.0",
    "structlog>=25.1.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
]

[project.scripts]
triagepilot = "triagepilot:main"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triagepilot = ["prompts/*.prompt.md"]

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.0.0", "ruff>=0.9.0", "mypy>=1.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B904",   # raise from within except (too noisy for existing code)
    "SIM105", # contextlib.suppress (less readable than try/except/pass)
    "SIM108", # ternary operator (readability preference)
    "B905",   # zip strict (not needed for internal iteration)
]

[tool.ruff.lint.isort]
known-first-party = ["triagepilot"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "triagepilot.graph.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "triagepilot.backends.cdb"
ignore_errors = true
